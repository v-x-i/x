<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060b18">
<title>VUS x Itsuki Launcher</title>
<style>
/* Dark UI everywhere. Left = VUS (blue/green), right = Itsuki (seasonal). Time of day only changes glow strength. */
:root{
  color-scheme:dark;
  --bg1:#060b18;--bg2:#0d1630;--panel:rgba(14,22,42,.58);--line:rgba(148,163,184,.22);--text:#eef4ff;--muted:#9aa9c2;
  --vus:#43e28b;--itsuki:#b98aff;--shadow:rgba(0,0,0,.4);--fx:#fff;
  --ibg1:#140b2a;--ibg2:#2a1240;--g1:185,138,255;--g2:255,108,180;--ga:.24;
}
html[data-time="day"]{--ga:.36}
html[data-time="evening"]{--ga:.3}
html[data-time="night"]{--ga:.2}
html[data-season="halloween"]{--ibg1:#0d0714;--ibg2:#22101a;--g1:255,110,30;--g2:150,70,255;--fx:#ffb347;--o1:#fff8dc;--o2:#ffd98a;--o3:#e9a24a;--og:255,170,70;--v1:rgba(255,110,20,.16);--v2:rgba(140,60,255,.16);--f1:rgba(200,170,255,.14);--f2:rgba(255,170,100,.10)}
html[data-season="spring"]{--ibg1:#1b1033;--ibg2:#3a1a44;--g1:255,150,190;--g2:140,220,150;--fx:#ffb7d0;--o1:#fff6c8;--o2:#ffe08a;--o3:#ffc864;--og:255,200,120;--v1:rgba(255,150,190,.18);--v2:rgba(140,220,150,.14);--f1:rgba(255,200,220,.18);--f2:rgba(190,240,200,.14)}
html[data-season="summer"]{--ibg1:#2a1408;--ibg2:#4a2410;--g1:255,190,60;--g2:255,120,60;--fx:#ffd76a;--o1:#fffbe0;--o2:#ffe066;--o3:#ffb703;--og:255,190,40;--v1:rgba(255,190,60,.20);--v2:rgba(255,120,60,.14);--f1:rgba(255,220,130,.18);--f2:rgba(255,170,90,.14)}
html[data-season="autumn"]{--ibg1:#25110a;--ibg2:#431d0e;--g1:255,130,40;--g2:190,60,30;--fx:#ff9a3c;--o1:#ffe0a8;--o2:#ffb060;--o3:#e07a30;--og:255,140,50;--v1:rgba(255,130,40,.18);--v2:rgba(190,60,30,.16);--f1:rgba(255,170,100,.16);--f2:rgba(190,110,60,.13)}
html[data-season="winter"]{--ibg1:#0c1a30;--ibg2:#18385a;--g1:150,200,255;--g2:220,240,255;--fx:#fff;--o1:#f4fbff;--o2:#cfe6ff;--o3:#9cc3f0;--og:160,200,255;--v1:rgba(150,200,255,.20);--v2:rgba(220,240,255,.14);--f1:rgba(210,230,255,.20);--f2:rgba(170,200,255,.14)}

*{box-sizing:border-box}
html{background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg1)}
/* Split background: VUS layer sits underneath; the Itsuki layer is masked on top (mask is moved by the mouse) */
.bg-vus,.bg-its{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-vus{background:radial-gradient(900px 600px at 8% 0%,rgba(67,226,139,.18),transparent 60%),radial-gradient(800px 600px at 30% 105%,rgba(40,120,255,.22),transparent 62%),linear-gradient(165deg,#040a1a,#07173a 55%,#05132c)}
.bg-vus canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bg-its{-webkit-mask-image:linear-gradient(100deg,transparent 34%,#000 66%);mask-image:linear-gradient(100deg,transparent 34%,#000 66%)}
.its-base{position:absolute;inset:0;background:radial-gradient(ellipse at 90% 8%,rgba(var(--g2),var(--ga)),transparent 45%),radial-gradient(ellipse at 70% 105%,rgba(var(--g1),var(--ga)),transparent 50%),linear-gradient(160deg,var(--ibg1),var(--ibg2))}

/* Lite mode: switched on automatically if the page runs below ~24 fps */
html.lite .site{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent 50%),rgba(14,22,42,.82)}
html.lite .deco .d-x,html.lite .d-fog{display:none}

/* ---- Seasonal decorations ---- */
.deco{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;contain:layout paint style;opacity:0;transition:opacity .8s ease}
.deco.in{opacity:1}
.deco *{pointer-events:none}
.d-vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 115%,var(--v1),transparent 55%),radial-gradient(90% 70% at 100% 0,var(--v2),transparent 60%),radial-gradient(70% 60% at 0 0,var(--v1),transparent 60%)}
.d-orb{position:absolute;top:12vh;right:5%;width:clamp(48px,7vw,84px);aspect-ratio:1;border-radius:50%;opacity:.75;scale:.2;transition:scale 1s cubic-bezier(.16,1,.3,1) .15s;animation:dBob 8s ease-in-out infinite;
  background:radial-gradient(circle at 30% 30%,var(--o1),var(--o2) 58%,var(--o3));box-shadow:0 0 34px 10px rgba(var(--og),.3),0 0 90px 30px rgba(var(--og),.14)}
.deco.in .d-orb{scale:1}
html[data-season="halloween"] .d-orb::after,html[data-season="autumn"] .d-orb::after,html[data-season="winter"] .d-orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 62% 38%,rgba(120,80,40,.3) 0 7%,transparent 8%),radial-gradient(circle at 38% 66%,rgba(120,80,40,.26) 0 10%,transparent 11%),radial-gradient(circle at 70% 70%,rgba(120,80,40,.22) 0 5%,transparent 6%)}
html[data-season="summer"] .d-orb::before,html[data-season="spring"] .d-orb::before{content:"";position:absolute;inset:-75%;border-radius:50%;animation:dSpin 40s linear infinite;
  background:repeating-conic-gradient(rgba(255,225,110,.26) 0 5deg,transparent 5deg 22deg);-webkit-mask:radial-gradient(circle,transparent 18%,#000 20%,transparent 68%);mask:radial-gradient(circle,transparent 18%,#000 20%,transparent 68%)}
.d-cor{position:absolute;top:0;width:150px;height:150px;color:rgba(255,255,255,.17);opacity:0;display:flex;transition:translate .9s cubic-bezier(.16,1,.3,1) .1s,opacity .6s ease .1s}
.d-cor.l{left:0;translate:-50px -50px}.d-cor.r{right:0;transform:scaleX(-1);translate:50px -50px}
.deco.in .d-cor{translate:0 0;opacity:1}
.d-cor svg{width:100%;height:100%}
.d-cor em{font-style:normal;font-size:84px;line-height:1;filter:drop-shadow(0 0 14px rgba(var(--og),.55))}
html[data-season="winter"] .d-cor{color:rgba(190,225,255,.5)}
.d-hang{position:absolute;top:0;left:var(--x);display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:dSwing 4.5s ease-in-out infinite;translate:0 -130%;transition:translate 1.1s cubic-bezier(.16,1,.3,1) .3s}
.deco.in .d-hang{translate:0 0}
.d-hang u{display:block;width:1px;height:var(--l);background:color-mix(in srgb,var(--text) 35%,transparent)}
.d-hang b{font-size:22px;font-weight:400}
.d-fly{position:absolute;left:-70px;top:var(--y);font-size:var(--s);opacity:.8;animation:dFly var(--d) linear var(--t) infinite;will-change:transform}
.d-fly i{display:block;font-style:normal;animation:dFlap .3s ease-in-out infinite alternate}
.d-rise{position:absolute;bottom:-60px;left:var(--x);font-size:30px;opacity:0;animation:dRise var(--d) ease-in-out var(--t) infinite;will-change:transform,opacity}
.d-fall{position:absolute;top:-8vh;left:var(--x);font-size:var(--s);opacity:0;animation:dFall var(--d) linear var(--t) infinite;will-change:transform}
.d-dot{position:absolute;bottom:-10px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:var(--fx);box-shadow:0 0 8px 2px var(--fx);opacity:0;animation:dEm var(--d) linear var(--t) infinite}
html[data-season="winter"] .d-dot{bottom:auto;top:-6px;box-shadow:0 0 6px var(--fx);animation-name:dFall}
.d-pk{position:absolute;bottom:6px;font-size:36px;line-height:1;opacity:.95;text-shadow:0 0 16px rgba(var(--og),.8);animation:dBob 2.8s ease-in-out infinite;translate:0 90px;transition:translate .8s cubic-bezier(.16,1,.3,1) .35s}
.deco.in .d-pk{translate:0 0}
.d-pk.l{left:8px}.d-pk.r{right:8px;animation-delay:-1.4s}
.d-fog{position:absolute;left:-20%;bottom:-40px;width:140%;height:200px;animation:dFog 26s ease-in-out infinite alternate;background:radial-gradient(50% 100% at 30% 100%,var(--f1),transparent 70%),radial-gradient(40% 90% at 72% 100%,var(--f2),transparent 70%)}
.d-fog.f2{animation-duration:36s;animation-direction:alternate-reverse;opacity:.7}
@keyframes dBob{50%{transform:translate3d(0,-6px,0)}}
@keyframes dSpin{to{transform:rotate(360deg)}}
@keyframes dSwing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes dFlap{from{transform:scale(1,1)}to{transform:scale(.55,1.1)}}
@keyframes dFly{0%{transform:translate3d(0,0,0) rotate(-6deg)}25%{transform:translate3d(28vw,-34px,0) rotate(8deg)}50%{transform:translate3d(58vw,20px,0) rotate(-8deg)}75%{transform:translate3d(86vw,-26px,0) rotate(7deg)}100%{transform:translate3d(118vw,6px,0) rotate(-4deg)}}
@keyframes dRise{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.5}50%{transform:translate3d(36px,-55vh,0)}88%{opacity:.35}100%{transform:translate3d(-24px,-112vh,0);opacity:0}}
@keyframes dFall{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.7}100%{transform:translate3d(var(--dx),112vh,0) rotate(360deg);opacity:0}}
@keyframes dEm{0%{transform:translate3d(0,0,0) scale(1);opacity:0}10%{opacity:.85}100%{transform:translate3d(var(--dx),-95vh,0) scale(.3);opacity:0}}
@keyframes dFog{from{transform:translate3d(-6%,0,0)}to{transform:translate3d(6%,0,0)}}
/* toggle + switch effects */
.fx-switch{position:fixed;top:14px;right:14px;z-index:20;display:flex;align-items:center;gap:9px;padding:7px 10px 7px 14px;border-radius:40px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);font-size:13px}
.fx-switch:hover{border-color:var(--vus)}
.fx-switch b{font-weight:600}
.sw{position:relative;width:38px;height:22px;border-radius:20px;background:rgba(127,127,127,.3);transition:background .25s}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.fx-switch[aria-checked="true"] .sw{background:linear-gradient(135deg,var(--vus),var(--itsuki))}
.fx-switch[aria-checked="true"] .sw i{transform:translateX(16px)}
.fx-ripple{position:fixed;z-index:900;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(var(--g1),.7),rgba(var(--g2),.45) 55%,transparent 72%);animation:fxRipple .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxRipple{0%{transform:scale(0);opacity:1}70%{opacity:.5}100%{transform:scale(70);opacity:0}}
.d-pop{position:fixed;top:var(--y);left:var(--x);z-index:950;font-size:26px;pointer-events:none;animation:dPop 1.6s ease-out forwards}
@keyframes dPop{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-170px) scale(1.4) rotate(var(--r))}}
@media(max-width:700px){.deco .d-x{display:none}.d-cor{width:90px;height:90px}.d-cor em{font-size:52px}.d-orb{top:9vh}.d-pk{font-size:26px}.fx-switch{top:10px;right:10px}}
/* Respect "reduce motion" system setting: stop decoration animations */
@media(prefers-reduced-motion:reduce){.deco *,.deco *::before,.deco *::after{animation:none!important}.d-fall,.d-rise,.d-dot{display:none}}

main{position:relative;z-index:1;width:min(1050px,calc(100% - 32px));margin:auto;padding:42px 0 30px}
header{text-align:center;margin-bottom:30px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1;letter-spacing:-.04em;margin:9px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.site{--accent:var(--vus);position:relative;background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent 50%),var(--panel);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:20px;padding:23px;min-width:0;
  box-shadow:0 18px 55px var(--shadow),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.site:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));
  box-shadow:0 26px 70px var(--shadow),0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent),inset 0 1px 0 rgba(255,255,255,.16)}
.site.partner{--accent:var(--itsuki)}
.site-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.logo{width:58px;height:58px;flex:0 0 58px;border-radius:15px;object-fit:cover;background:#1b2438;border:1px solid var(--line);display:block}
.logo-fallback{display:none;width:58px;height:58px;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--accent);border-radius:15px;border:1px solid var(--line)}
h2{font-size:23px;margin:0;letter-spacing:-.025em}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:21px 0 9px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{font:inherit;font-weight:650;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-align:center;
  transition:transform .2s,border-color .2s,background .2s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 28%,transparent)}
button:active{transform:translateY(0) scale(.98)}
.primary{background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#fff));color:#07110d;border-color:transparent}
.primary:hover{filter:brightness(1.06)}
.secondary{background:rgba(255,255,255,.06)}
.version{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.04em;padding:6px 0 26px}

/* ---- Link dropdown groups ---- */
.link-groups{margin-top:6px}
.lg{margin-top:8px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);overflow:hidden;transition:border-color .2s}
.lg[open]{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.lg summary{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;font-weight:650;cursor:pointer;list-style:none}
.lg summary::-webkit-details-marker{display:none}
.lg summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.lg[open] summary::after{transform:rotate(180deg)}
.lg-list{display:grid;gap:6px;padding:0 10px 10px}
.lg-list a{display:block;padding:9px 11px;border-radius:9px;color:var(--text);text-decoration:none;background:rgba(255,255,255,.06);border:1px solid transparent;transition:border-color .2s,transform .2s}
.lg-list a:hover{border-color:var(--accent);transform:translateX(3px)}

/* ---- Launch mode picker ---- */
.modal-bg{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,8,18,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .25s ease}
.modal-bg.closing{opacity:0;transition:opacity .2s}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.95)}}
.modal{--accent:var(--vus);position:relative;width:100%;max-width:620px;max-height:calc(100vh - 24px);overflow-y:auto;padding:24px 22px 18px;border-radius:24px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 55%),color-mix(in srgb,var(--bg2) 94%,transparent);
  border:1px solid var(--line);box-shadow:0 30px 80px var(--shadow),inset 0 1px 0 rgba(255,255,255,.14);animation:popIn .4s cubic-bezier(.16,1,.3,1)}
.modal.partner{--accent:var(--itsuki)}
.m-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;padding:0;background:rgba(127,127,127,.15)}
.m-top{text-align:center}
.m-top .mi{width:48px;height:48px;margin:0 auto 10px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb,var(--accent) 20%,transparent);border:1px solid var(--line)}
.m-top h2{font-size:21px}
.m-top p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;padding-top:6px;transition:opacity .25s,filter .25s}
.modal.busy .mode-grid{opacity:.3;filter:blur(1px);pointer-events:none}
.mode-card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;padding:12px 12px 16px;border-radius:20px;background:rgba(127,127,127,.08);border:1px solid var(--line);
  transition:transform .3s cubic-bezier(.16,1,.3,1),border-color .2s,box-shadow .3s}
.mode-card:hover,.mode-card:focus-visible{outline:none;transform:translateY(-5px);border-color:var(--accent);box-shadow:0 18px 40px color-mix(in srgb,var(--accent) 28%,transparent)}
.mode-card.rec{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent)}
.mode-tag{position:absolute;top:-10px;right:14px;z-index:2;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 11px;border-radius:20px;color:#07110d;background:var(--accent)}
.pv{height:92px;border-radius:12px;overflow:hidden;background:#0a0b14;border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column}
.pv-tabs{display:flex;gap:3px;padding:6px 6px 0;background:#15162a}
.pv-tabs span{font-size:8px;font-weight:600;color:#7d80a8;padding:4px 9px;border-radius:6px 6px 0 0;background:rgba(255,255,255,.05)}
.pv-tabs span.on{color:#fff;background:#0a0b14}
.pv-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#15162a}
.pv-tabs+.pv-bar{background:#0a0b14;border-bottom:1px solid rgba(255,255,255,.06)}
.pv-bar i{width:6px;height:6px;border-radius:50%}
.pv-bar i:nth-child(1){background:#ff5f57}.pv-bar i:nth-child(2){background:#febc2e}.pv-bar i:nth-child(3){background:#28c840}
.pv-bar em{flex:1;height:9px;margin-left:6px;border-radius:6px;background:rgba(255,255,255,.08)}
.pv-body{flex:1;position:relative;overflow:hidden;padding:8px;display:flex;gap:6px}
.pv-body .sb{width:26%;border-radius:6px;background:color-mix(in srgb,var(--accent) 30%,transparent)}
.pv-body .ct{flex:1;display:flex;flex-direction:column;gap:5px;justify-content:center}
.pv-body .ct s{display:block;height:11px;border-radius:6px;background:rgba(255,255,255,.1)}
.pv-body .ct s:nth-child(2){width:72%;margin-left:auto;background:color-mix(in srgb,var(--accent) 60%,transparent)}
.pv-body .ct s:nth-child(3){width:55%}
.pv-body::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.1) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s ease}
.mode-card:hover .pv-body::after{transform:translateX(120%)}
.mode-card h3{margin:0;padding:0 4px;font-size:16.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--text)}
.mode-card p{margin:-4px 0 0;padding:0 4px;font-size:13px;line-height:1.5;color:var(--muted)}
.mode-pts{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px;margin-top:auto}
.mode-pts span{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(127,127,127,.15);color:var(--muted);white-space:nowrap}
.mode-pts span.g{background:rgba(76,214,160,.16);color:#2fbf86}
.mode-status{display:none;align-items:center;justify-content:center;gap:12px;margin-top:16px;padding:13px 16px;border-radius:14px;background:rgba(127,127,127,.1);border:1px solid var(--line);font-size:14px;font-weight:600;text-align:center}
.modal.busy .mode-status,.modal.err .mode-status{display:flex;animation:fadeIn .25s ease}
.modal.err .mode-grid{opacity:1;filter:none;pointer-events:auto}
.modal.err .mode-status{color:#ff6b81;border-color:rgba(255,93,115,.4);background:rgba(255,93,115,.08)}
.spin{width:18px;height:18px;flex:none;border-radius:50%;border:2.5px solid rgba(127,127,127,.3);border-top-color:var(--accent);animation:spin .75s linear infinite}
.modal.err .spin{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.mode-foot{margin-top:12px;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr;gap:18px}.pv{height:80px}}
@media(max-height:640px){.pv,.m-top .mi,.mode-foot{display:none}}

<script>
const VUS_URL = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/main/index.html";
const ITSUKI_URL = "https://raw.githubusercontent.com/AniItsukiCoded/backups/refs/heads/main/%28USE%29%20-%20Launcher%20Loader.html";

/* New-tab cover: this page shows behind the site, which loads on top after the delay (milliseconds). */
const COVER_URL = "https://quizlet.com";
const NEW_TAB_DELAY = 6000;

/* Add mirror URLs between the quotes below. Leave an entry as "" to hide it. */
const VUS_MIRRORS = ["", "", ""];
const ITSUKI_MIRRORS = ["", "", ""];

/* Link dropdowns: each group is a dropdown, each link goes inside it. Edit freely.
   An empty array [] hides that card's Links section. */
const LINK_GROUPS = {
  "vus-links": [
    { name: "CodePen", links: [
      { label: "CodePen link 1", url: "https://google.com" },
      { label: "CodePen link 2", url: "https://google.com" },
      { label: "CodePen link 3", url: "https://google.com" }
    ]},
    { name: "Group 2", links: [
      { label: "Link 1", url: "https://google.com" },
      { label: "Link 2", url: "https://google.com" }
    ]}
  ],
  "partner-links": [
    { name: "CodePen", links: [
      { label: "CodePen link 1", url: "https://google.com" },
      { label: "CodePen link 2", url: "https://google.com" }
    ]}
  ]
};

/* ---- Seasonal theme: time of day + season, with big decorations ---- */
/* Force a season by typing its name: "halloween", "spring", "summer", "autumn" or "winter". Leave "" for automatic (by month). */
const SEASON_OVERRIDE = "";
const FX_KEY = "launcher.fx";
const WEB = '<svg viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="1"><path d="M0 0L120 0M0 0L0 120M0 0L100 60M0 0L60 100M0 0L115 25M0 0L25 115"/><path d="M0 30Q18 18 30 0M0 55Q32 36 55 0M0 82Q50 58 82 0M0 110Q70 82 110 0"/></g></svg>';
const BRANCH = '<svg viewBox="0 0 120 120"><path d="M0 18Q40 22 70 52T118 100" fill="none" stroke="#7a5a4a" stroke-width="3" stroke-linecap="round"/><g fill="#ffb7d0"><circle cx="30" cy="24" r="7"/><circle cx="52" cy="38" r="6"/><circle cx="74" cy="60" r="7"/><circle cx="95" cy="82" r="6"/><circle cx="14" cy="34" r="5"/><circle cx="62" cy="54" r="5"/></g><g fill="#fff3a8"><circle cx="30" cy="24" r="2"/><circle cx="74" cy="60" r="2"/><circle cx="52" cy="38" r="2"/><circle cx="95" cy="82" r="2"/></g></svg>';
const SEASON_FX = {
  halloween:{icon:"🎃",label:"Halloween",cor:WEB,hang:"🕷️",fly:"🦇",flyN:7,rise:"👻",riseN:4,fall:[],fallN:0,dotN:16,pk:["🎃","🎃"],pop:["🎃","🦇","👻","🕸️","🍬","💀"]},
  spring:{icon:"🌸",label:"Spring",cor:BRANCH,hang:"🎐",fly:"🦋",flyN:6,rise:"",riseN:0,fall:["🌸","🌸","🌺","🌼"],fallN:18,dotN:0,pk:["🌷","🌼"],pop:["🌸","🦋","🌷","🌼","🐝"]},
  summer:{icon:"☀️",label:"Summer",cor:"<em>🌴</em>",hang:"",fly:"🐝",flyN:5,rise:"🫧",riseN:6,fall:[],fallN:0,dotN:22,pk:["🌻","🌴"],pop:["☀️","🌊","🌻","🍉","🕶️"]},
  autumn:{icon:"🍂",label:"Autumn",cor:"<em>🍁</em>",hang:"🍁",fly:"🍂",flyN:7,rise:"",riseN:0,fall:["🍁","🍂","🍂","🍃"],fallN:22,dotN:0,pk:["🌾","🎃"],pop:["🍁","🍂","🌰","🍄","🎃"]},
  winter:{icon:"❄️",label:"Winter",cor:WEB,hang:"❄️",fly:"",flyN:0,rise:"",riseN:0,fall:["❄️","❄","❅"],fallN:24,dotN:20,pk:["⛄","🎄"],pop:["❄️","⛄","🎄","⭐","🎁"]}
};
const root = document.documentElement;
function currentSeason() {
  if (SEASON_FX[SEASON_OVERRIDE]) return SEASON_OVERRIDE;
  const m = new Date().getMonth();
  if (m === 9) return "halloween";
  if (m >= 2 && m <= 4) return "spring";
  if (m >= 5 && m <= 7) return "summer";
  if (m === 8 || m === 10) return "autumn";
  return "winter";
}
function applyTime() {
  const h = new Date().getHours();
  root.dataset.time = h >= 6 && h < 17 ? "day" : h >= 17 && h < 20 ? "evening" : "night";
}
function buildDeco(s) {
  const c = SEASON_FX[s], r = (a, b) => (a + Math.random() * (b - a)).toFixed(2), x = (i, n) => i >= n / 2 ? " d-x" : "";
  let h = '<i class="d-vig"></i><i class="d-orb"></i><i class="d-fog"></i><i class="d-fog f2"></i><div class="d-cor l">' + c.cor + '</div><div class="d-cor r">' + c.cor + '</div>';
  if (c.hang) h += '<span class="d-hang" style="--x:14%;--l:60px"><u></u><b>' + c.hang + '</b></span><span class="d-hang d-x" style="--x:86%;--l:90px"><u></u><b>' + c.hang + '</b></span>';
  for (let i = 0; i < c.flyN; i++) h += '<b class="d-fly' + x(i, c.flyN) + '" style="--y:' + r(6, 55) + 'vh;--s:' + r(16, 28) + 'px;--d:' + r(16, 30) + 's;--t:-' + r(0, 24) + 's"><i>' + c.fly + '</i></b>';
  for (let i = 0; i < c.riseN; i++) h += '<b class="d-rise' + x(i, c.riseN) + '" style="--x:' + r(4, 92) + '%;--d:' + r(20, 34) + 's;--t:-' + r(0, 30) + 's">' + c.rise + '</b>';
  for (let i = 0; i < c.fallN; i++) h += '<b class="d-fall' + x(i, c.fallN) + '" style="--x:' + r(0, 100) + '%;--s:' + r(14, 28) + 'px;--dx:' + r(-90, 90) + 'px;--d:' + r(9, 18) + 's;--t:-' + r(0, 18) + 's">' + c.fall[i % c.fall.length] + '</b>';
  for (let i = 0; i < c.dotN; i++) h += '<i class="d-dot' + x(i, c.dotN) + '" style="--x:' + r(0, 100) + '%;--s:' + r(2, 5) + 'px;--dx:' + r(-60, 60) + 'px;--d:' + r(9, 18) + 's;--t:-' + r(0, 16) + 's"></i>';
  return h + '<b class="d-pk l">' + c.pk[0] + '</b><b class="d-pk r d-x">' + c.pk[1] + '</b>';
}
function setDeco(on) {
  const season = currentSeason(), c = SEASON_FX[season], d = document.getElementById("deco");
  clearTimeout(d._rm);
  document.getElementById("fxIcon").textContent = c.icon;
  document.getElementById("fxLabel").textContent = c.label;
  document.getElementById("fxToggle").setAttribute("aria-checked", on);
  if (on) {
    root.dataset.season = season;
    d.innerHTML = buildDeco(season);
    void d.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add("in")));
  } else {
    d.classList.remove("in");
    delete root.dataset.season;
    d._rm = setTimeout(() => { d.innerHTML = ""; }, 1000);
  }
  setRain(on);
}
function fxWanted() { try { return localStorage.getItem(FX_KEY) !== "0"; } catch (_) { return true; } }
function fxBurst() {
  const em = SEASON_FX[currentSeason()].pop;
  for (let i = 0; i < 22; i++) {
    const e = document.createElement("b");
    e.className = "d-pop";
    e.style.cssText = "--x:" + (20 + Math.random() * 60) + "vw;--y:" + (55 + Math.random() * 25) + "vh;--dx:" + ((Math.random() - .5) * 220) + "px;--r:" + ((Math.random() - .5) * 80) + "deg;animation-delay:" + (Math.random() * .35) + "s";
    e.textContent = em[i % em.length];
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 2200);
  }
}
let fxBusy = false;
document.getElementById("fxToggle").addEventListener("click", () => {
  if (fxBusy) return;
  fxBusy = true;
  const btn = document.getElementById("fxToggle");
  const on = btn.getAttribute("aria-checked") !== "true";
  try { localStorage.setItem(FX_KEY, on ? "1" : "0"); } catch (_) {}
  btn.setAttribute("aria-checked", on);
  {
    const rc = btn.getBoundingClientRect(), rp = document.createElement("div");
    rp.className = "fx-ripple";
    rp.style.left = (rc.left + rc.width / 2) + "px";
    rp.style.top = (rc.top + rc.height / 2) + "px";
    document.body.appendChild(rp);
    setTimeout(() => rp.remove(), 1000);
  }
  setTimeout(() => { setDeco(on); if (on) fxBurst(); }, 160);
  setTimeout(() => { fxBusy = false; }, 900);
});
/* ---- Split background: VUS (left, digit rain) / Itsuki (right, seasonal). Mouse position moves the blend. ---- */
const bgIts = document.getElementById("bgIts");
let split = .5, splitTarget = .5, splitRaf = 0;
function applySplit() {
  const m = "linear-gradient(100deg,transparent " + ((split - .16) * 100).toFixed(1) + "%,#000 " + ((split + .16) * 100).toFixed(1) + "%)";
  bgIts.style.webkitMaskImage = m;
  bgIts.style.maskImage = m;
}
let splitT = 0;
function splitStep(t) {
  const dt = splitT ? Math.min(t - splitT, 100) : 16;
  splitT = t;
  const d = splitTarget - split;
  if (Math.abs(d) < .002) { split = splitTarget; applySplit(); splitRaf = 0; splitT = 0; return; }
  split += d * (1 - Math.exp(-dt / 140));
  applySplit();
  splitRaf = requestAnimationFrame(splitStep);
}
function setSplit(v) {
  splitTarget = Math.max(.2, Math.min(.8, v));
  if (!splitRaf) splitRaf = requestAnimationFrame(splitStep);
}
/* mouse on the right -> Itsuki's side grows; mouse on the left -> VUS grows */
window.addEventListener("pointermove", e => setSplit(.78 - (e.clientX / window.innerWidth) * .56), {passive:true});
document.documentElement.addEventListener("mouseleave", () => setSplit(.5));
applySplit();

/* Digit rain: one canvas, pre-drawn glyph sprites, ~30 fps, only columns on the visible (VUS) side are drawn.
   Every digit flips 0<->1 on its own random timer and every column has its own speed, so nothing is in sync. */
const CELL = 22;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const rainCv = document.getElementById("rain"), rctx = rainCv.getContext("2d");
function mkSprite(ch, color, glow) {
  const c = document.createElement("canvas");
  c.width = CELL * DPR; c.height = CELL * DPR;
  const x = c.getContext("2d");
  x.scale(DPR, DPR);
  x.font = "700 17px ui-monospace,Menlo,Consolas,monospace";
  x.textAlign = "center"; x.textBaseline = "middle";
  if (glow) { x.shadowColor = "#43e28b"; x.shadowBlur = 8; }
  x.fillStyle = color;
  x.fillText(ch, CELL / 2, CELL / 2 + 1);
  return c;
}
const SPR = [[mkSprite("0", "#43e28b"), mkSprite("1", "#43e28b")], [mkSprite("0", "#d8ffe9", true), mkSprite("1", "#d8ffe9", true)]];
let rainCols = [], rainOn = false, rainRaf = 0, lastT = 0, W = 0, H = 0, ROWS = 0, rsT = 0;
function newCol(i, t) {
  const L = 8 + Math.floor(Math.random() * 15);
  const c = {x: i * CELL, L, d: new Uint8Array(L), f: new Float64Array(L), h: 0, acc: 0, a: .5 + Math.random() * .5, step: 55 + Math.random() * 120};
  for (let k = 0; k < L; k++) { c.d[k] = Math.random() < .5 ? 0 : 1; c.f[k] = t + Math.random() * 1700; }
  c.row = Math.floor(Math.random() * (ROWS + L)) - L;
  return c;
}
function advance(c, t) {
  c.row++;
  c.h = (c.h + 1) % c.L;
  c.d[c.h] = Math.random() < .5 ? 0 : 1;
  c.f[c.h] = t + 250 + Math.random() * 1500;
  if (c.row - c.L > ROWS) { c.row = -Math.floor(Math.random() * 40); c.step = 55 + Math.random() * 120; }
}
function drawCol(c, t) {
  for (let k = 0; k < c.L; k++) {
    const r = c.row - k;
    if (r < 0 || r >= ROWS) continue;
    const i = ((c.h - k) % c.L + c.L) % c.L;
    if (t > c.f[i]) { c.d[i] ^= 1; c.f[i] = t + 300 + Math.random() * 2000; }
    rctx.globalAlpha = (k === 0 ? 1 : Math.pow(1 - k / c.L, 1.5) * .72) * c.a;
    rctx.drawImage(SPR[k === 0 ? 1 : 0][c.d[i]], c.x, r * CELL, CELL, CELL);
  }
}
let perfFrames = 0, perfStart = 0, lowRuns = 0, lite = false;
function checkPerf(t) {
  if (!perfStart || t - perfStart > 3000) { perfStart = t; perfFrames = 0; return; }   /* reset after tab was hidden */
  perfFrames++;
  if (t - perfStart < 2000) return;
  const fps = perfFrames * 1000 / (t - perfStart);
  perfStart = t; perfFrames = 0;
  if (fps < 24) { if (++lowRuns >= 2 && !lite) { lite = true; document.documentElement.classList.add("lite"); } } else lowRuns = 0;
}
function rainFrame(t) {
  rainRaf = requestAnimationFrame(rainFrame);
  checkPerf(t);
  const dt = t - lastT;
  if (dt < (lite ? 45 : 32)) return;
  lastT = t;
  const step = Math.min(dt, 100), limit = (split + .16) * W + CELL;
  rctx.clearRect(0, 0, W, H);
  for (let n = 0; n < rainCols.length; n++) {
    const c = rainCols[n];
    c.acc += step;
    while (c.acc >= c.step) { c.acc -= c.step; advance(c, t); }
    if (c.x < limit && !(lite && (n & 1))) drawCol(c, t);
  }
}
function sizeRain() {
  W = window.innerWidth; H = window.innerHeight;
  rainCv.width = W * DPR; rainCv.height = H * DPR;
  rctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ROWS = Math.ceil(H / CELL);
  const t = performance.now();
  rainCols = [];
  for (let i = 0; i < Math.ceil(W / CELL); i++) rainCols.push(newCol(i, t));
}
function setRain(on) {
  if (on === rainOn) return;
  rainOn = on;
  rainCv.style.display = on ? "" : "none";
  cancelAnimationFrame(rainRaf);
  if (on) { sizeRain(); lastT = 0; rainRaf = requestAnimationFrame(rainFrame); }
}
window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (rainOn) sizeRain(); }, 200); });

applyTime();
setDeco(fxWanted());
setInterval(applyTime, 5 * 60 * 1000);

/* ---- Launcher logic ---- */
function validUrl(value) {
  try {
    const u = new URL(String(value).trim());
    return u.protocol === "https:" || u.protocol === "http:";
  } catch (_) { return false; }
}
let pendingUrl = "";
const modeBg = document.getElementById("modeBg"), modeBox = document.getElementById("modeBox");
function setStatus(kind, msg) {
  modeBox.classList.toggle("busy", kind === "load");
  modeBox.classList.toggle("err", kind === "err");
  if (kind) document.getElementById("modeStatusTxt").textContent = msg;
}
function chooseMode(url, label, partner) {
  pendingUrl = url;
  setStatus(null);
  modeBox.classList.toggle("partner", !!partner);
  document.getElementById("modeTitle").textContent = "Launch " + label;
  modeBg.classList.remove("closing");
  modeBg.classList.add("show");
  setTimeout(() => document.getElementById("modeNew").focus({preventScroll:true}), 60);
}
function closeModal() {
  if (!modeBg.classList.contains("show")) return;
  modeBg.classList.add("closing");
  setTimeout(() => { modeBg.classList.remove("show", "closing"); setStatus(null); }, 200);
}
document.getElementById("modeNew").addEventListener("click", () => launch(pendingUrl, "new"));
document.getElementById("modeSame").addEventListener("click", () => launch(pendingUrl, "same"));
document.getElementById("modeX").addEventListener("click", closeModal);
modeBg.addEventListener("click", e => { if (e.target === modeBg) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function showError(target, message) {
  target.document.open();
  target.document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Launcher error</title><body style="background:#0b1020;color:#eef4ff;font:16px system-ui;padding:32px"><h2>Could not open this site</h2><p>' + message.replace(/</g, "&lt;").replace(/>/g, "&gt;") + '</p><p>Check the URL or try again.</p></body>');
  target.document.close();
}
async function launch(url, mode) {
  if (!validUrl(url)) { setStatus("err", "That link doesn't look like a valid HTTP or HTTPS URL."); return; }
  const target = mode === "new" ? window.open("about:blank", "_blank") : window;
  if (!target) { setStatus("err", "Your browser blocked the new tab. Allow pop-ups for this page and try again."); return; }
  if (mode === "new") {
    closeModal();
    target.document.open();
    target.document.write('<!doctype html><title>Quizlet</title><body style="margin:0;background:#fff;overflow:hidden"><iframe src="' + COVER_URL + '" style="position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff"></iframe></body>');
    target.document.close();
  }
  const started = Date.now();
  if (mode === "same") setStatus("load", "Loading site from GitHub…");
  try {
    const response = await fetch(url, {cache:"no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const html = await response.text();
    if (!/<html[\s>]/i.test(html)) throw new Error("The response does not look like an HTML page.");
    if (mode === "new") {
      await new Promise(r => setTimeout(r, Math.max(0, NEW_TAB_DELAY - (Date.now() - started))));
      if (target.closed) return;
      const f = target.document.createElement("iframe");
      f.setAttribute("allow", "fullscreen; clipboard-read; clipboard-write; autoplay; microphone; camera; geolocation; encrypted-media; picture-in-picture");
      f.setAttribute("allowfullscreen", "");
      f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2;background:#0b1020";
      f.srcdoc = html;
      target.document.body.appendChild(f);
    } else {
      target.document.open();
      target.document.write(html);
      target.document.close();
    }
  } catch (error) {
    const msg = "The launcher could not fetch the page from GitHub (" + error.message + "). Try opening this raw URL directly: " + url;
    if (mode === "new") showError(target, msg);
    else setStatus("err", msg);
  }
}
function buildMirrors(cardId, mirrors) {
  const card = document.getElementById(cardId);
  const mainActions = card.querySelector(".actions");
  const usable = mirrors.map(x => (x || "").trim()).filter(validUrl);
  usable.forEach((url, index) => {
    const button = document.createElement("button");
    button.className = "secondary";
    button.textContent = "Launch mirror " + (index + 1);
    button.addEventListener("click", () => chooseMode(
      url,
      card.querySelector("h2").textContent + " mirror " + (index + 1),
      card.classList.contains("partner")
    ));
    mainActions.appendChild(button);
  });
}
function buildLinkGroups(hostId, groups) {
  const host = document.getElementById(hostId);
  if (!groups || !groups.length) { host.remove(); return; }
  const title = document.createElement("h3");
  title.textContent = "Links";
  host.appendChild(title);
  groups.forEach(g => {
    const d = document.createElement("details");
    d.className = "lg";
    const s = document.createElement("summary");
    s.textContent = g.name;
    const list = document.createElement("div");
    list.className = "lg-list";
    g.links.filter(l => validUrl(l.url)).forEach(l => {
      const a = document.createElement("a");
      a.href = l.url; a.textContent = l.label;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      list.appendChild(a);
    });
    d.append(s, list);
    /* only one dropdown open at a time per card */
    d.addEventListener("toggle", () => {
      if (d.open) host.querySelectorAll("details.lg[open]").forEach(o => { if (o !== d) o.open = false; });
    });
    host.appendChild(d);
  });
}
function setLogo(imgId, fallbackId, candidates) {
  const img = document.getElementById(imgId);
  const fallback = document.getElementById(fallbackId);
  let index = 0;
  img.onerror = () => {
    index++;
    if (index < candidates.length) img.src = candidates[index];
    else { img.style.display = "none"; fallback.style.display = "flex"; }
  };
  img.src = candidates[index];
}
document.querySelector("#vus-card .actions .primary").addEventListener("click", () => chooseMode(VUS_URL, "VUS", false));
document.querySelector("#partner-card .actions .primary").addEventListener("click", () => chooseMode(ITSUKI_URL, "Itsuki", true));
buildMirrors("vus-card", VUS_MIRRORS);
buildMirrors("partner-card", ITSUKI_MIRRORS);
Object.entries(LINK_GROUPS).forEach(([id, groups]) => buildLinkGroups(id, groups));
setLogo("vus-logo","vus-fallback",[
  "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/refs/heads/main/logo",
  "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/main/logo"
]);
setLogo("partner-logo","partner-fallback",[
  "https://raw.githubusercontent.com/AniItsukiCoded/backups/main/icon.png",
  "https://github.com/AniItsukiCoded/backups/raw/main/icon.png"
]);
